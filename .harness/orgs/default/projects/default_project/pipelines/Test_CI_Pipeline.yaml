pipeline:
  name: Test CI Pipeline
  identifier: Test_CI_Pipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Harness_CI_Pipeline_Config
        repoName: react-pipeline-sample
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: npm_commands
                  identifier: npm_commands
                  spec:
                    shell: Sh
                    command: |-
                      npm install
                      npm run build
                      npm test
                contextType: Pipeline
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: docker_connector
                    repo: gurpreetji/harness_test_repo
                    tags:
                      - harness
        runMode:
          type: Manual
          timeout: 5m
